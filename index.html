<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RGB PC Controller</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Iconos Bootstrap -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container-fluid py-4">

        <!-- ================================= -->
        <!-- ENCABEZADO -->
        <!-- ================================= -->

        <header class="text-center mb-4">

            <div class="logo">
                <i class="bi bi-pc-display"></i>
            </div>

            <h1>RGB CONTROL CENTER</h1>

            <p class="subtitle">
                Personaliza la iluminación de tu PC
            </p>

        </header>


        <div class="row g-4 justify-content-center">


            <!-- ================================= -->
            <!-- PC -->
            <!-- ================================= -->

            <div class="col-lg-7">

                <div class="panel pc-panel">

                    <div class="panel-header">
                        <span>
                            <i class="bi bi-cpu"></i>
                            PC GAMING
                        </span>

                        <span class="status">
                            ● ONLINE
                        </span>
                    </div>


                    <!-- GABINETE -->

                    <div class="pc-case">


                        <!-- PANEL DE VIDRIO -->

                        <div class="glass-panel">


                            <!-- MOTHERBOARD -->

                            <div class="motherboard">


                                <!-- CPU -->

                                <div class="cpu-cooler">

                                    <div class="cooler-ring">

                                        <div class="cooler-center">
                                            CPU
                                        </div>

                                    </div>

                                </div>


                                <!-- RAM -->

                                <div class="ram ram-1">

                                    <div class="ram-stick">

                                        <div class="ram-led"></div>

                                        <span>DDR5</span>

                                    </div>

                                </div>


                                <div class="ram ram-2">

                                    <div class="ram-stick">

                                        <div class="ram-led"></div>

                                        <span>DDR5</span>

                                    </div>

                                </div>


                                <!-- GPU -->

                                <div class="gpu">

                                    <div class="gpu-line"></div>

                                    <span>GPU</span>

                                </div>


                            </div>


                            <!-- VENTILADORES -->

                            <div class="fans">

                                <div class="fan">

                                    <div class="fan-ring">

                                        <div class="fan-blades">

                                            <span></span>
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                            <span></span>

                                        </div>

                                        <div class="fan-center"></div>

                                    </div>

                                </div>


                                <div class="fan">

                                    <div class="fan-ring">

                                        <div class="fan-blades">

                                            <span></span>
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                            <span></span>

                                        </div>

                                        <div class="fan-center"></div>

                                    </div>

                                </div>


                                <div class="fan">

                                    <div class="fan-ring">

                                        <div class="fan-blades">

                                            <span></span>
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                            <span></span>

                                        </div>

                                        <div class="fan-center"></div>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- ESTADO -->

                    <div class="pc-info">

                        <div>
                            <small>ILUMINACIÓN</small>
                            <strong id="pcColorName">
                                RGB
                            </strong>
                        </div>

                        <div>
                            <small>ESTADO</small>
                            <strong class="text-success">
                                SINCRONIZADO
                            </strong>
                        </div>

                    </div>

                </div>

            </div>



            <!-- ================================= -->
            <!-- CONTROLES -->
            <!-- ================================= -->

            <div class="col-lg-4">

                <div class="panel controls-panel">


                    <div class="panel-header">

                        <span>
                            <i class="bi bi-sliders"></i>
                            RGB CONTROLLER
                        </span>

                    </div>


                    <!-- COLOR PICKER -->

                    <div class="color-selector">

                        <label>
                            COLOR
                        </label>

                        <div class="color-picker-container">

                            <input
                                type="color"
                                id="colorPicker"
                                value="#00ffff"
                            >

                            <div>

                                <span>COLOR ACTUAL</span>

                                <strong id="hexCode">
                                    #00FFFF
                                </strong>

                            </div>

                        </div>

                    </div>


                    <hr>


                    <!-- RGB -->

                    <div class="rgb-values">

                        <div class="rgb-title">
                            VALORES RGB
                        </div>


                        <!-- ROJO -->

                        <div class="rgb-control red-control">

                            <div class="control-title">

                                <span>
                                    <i class="bi bi-circle-fill"></i>
                                    ROJO
                                </span>

                                <input
                                    type="number"
                                    id="redInput"
                                    min="0"
                                    max="255"
                                    value="0"
                                >

                            </div>

                            <input
                                type="range"
                                id="red"
                                min="0"
                                max="255"
                                value="0"
                            >

                        </div>


                        <!-- VERDE -->

                        <div class="rgb-control green-control">

                            <div class="control-title">

                                <span>
                                    <i class="bi bi-circle-fill"></i>
                                    VERDE
                                </span>

                                <input
                                    type="number"
                                    id="greenInput"
                                    min="0"
                                    max="255"
                                    value="255"
                                >

                            </div>

                            <input
                                type="range"
                                id="green"
                                min="0"
                                max="255"
                                value="255"
                            >

                        </div>


                        <!-- AZUL -->

                        <div class="rgb-control blue-control">

                            <div class="control-title">

                                <span>
                                    <i class="bi bi-circle-fill"></i>
                                    AZUL
                                </span>

                                <input
                                    type="number"
                                    id="blueInput"
                                    min="0"
                                    max="255"
                                    value="255"
                                >

                            </div>

                            <input
                                type="range"
                                id="blue"
                                min="0"
                                max="255"
                                value="255"
                            >

                        </div>

                    </div>


                    <hr>


                    <!-- RGB RESULTADO -->

                    <div class="result">

                        <div>

                            <span>RGB</span>

                            <strong id="rgbCode">
                                rgb(0, 255, 255)
                            </strong>

                        </div>


                        <div>

                            <span>HEX</span>

                            <strong id="hexResult">
                                #00FFFF
                            </strong>

                        </div>

                    </div>


                    <!-- BOTÓN -->

                    <button
                        class="btn btn-rgb w-100 mt-4"
                        onclick="randomColor()"
                    >

                        <i class="bi bi-shuffle"></i>

                        COLOR ALEATORIO

                    </button>


                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
